# Configures the "Sponsor" button at the top of this repository's GitHub page.
# See: https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository
#
# IMPORTANT: only uncomment a platform line once Anastasia has confirmed the
# account exists at that handle. A wrong handle produces a 404 Sponsor link,
# which is worse than no link at all.

# GitHub Sponsors — requires onboarding at https://github.com/sponsors/accounts
# (Stripe identity verification, typically ~1 week to approve).
# Once approved, the Sponsor button links to https://github.com/sponsors/kukoshock
github: [kukoshock]

